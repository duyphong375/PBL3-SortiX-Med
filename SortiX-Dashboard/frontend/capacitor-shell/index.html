<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070b14">
  <title>SortiX-Med Dashboard</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #070b14; color: #e5edf8; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(100%, 440px); text-align: center; padding: 32px; border: 1px solid #263449; border-radius: 20px; background: #101a2a; box-sizing: border-box; }
    h1 { margin: 0 0 16px; font-size: 1.6rem; }
    p { color: #a9bad0; line-height: 1.6; }
    a { display: inline-block; margin-top: 12px; padding: 12px 18px; border-radius: 10px; background: #1d8cf8; color: white; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>SortiX-Med Dashboard</h1>
    <p>Chưa kết nối được máy chủ dashboard. Kiểm tra kết nối mạng hoặc cấu hình máy chủ rồi thử lại.</p>
    <a href="">Thử kết nối lại</a>
  </main>
</body>
</html>
